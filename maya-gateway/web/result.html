<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maya Gateway — Result</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #f4f5f7; color: #1a1d21;
  }
  .card {
    background: #fff; padding: 2rem; border-radius: 12px;
    width: min(440px, 92vw); text-align: center;
    box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 8px 24px rgba(0,0,0,.06);
  }
  .icon { font-size: 2.5rem; line-height: 1; }
  h1 { font-size: 1.25rem; margin: .75rem 0 .5rem; }
  p { margin: .4rem 0; font-size: .9rem; color: #555; }
  code { background: #eef0f3; padding: .15rem .35rem; border-radius: 4px; font-size: .82rem; word-break: break-all; }
  a { color: #018ff4; }
  .warn { margin-top: 1.5rem; padding: .7rem; background: #fff8e1; border-left: 3px solid #f9a825;
          border-radius: 4px; font-size: .78rem; text-align: left; color: #6b5400; }
</style>
</head>
<body>
<div class="card">
  <div id="icon" class="icon"></div>
  <h1 id="title"></h1>
  <p id="msg"></p>
  <p>requestReferenceNumber<br><code id="rrn">—</code></p>
  <p><a href="/">Start over</a></p>

  <div class="warn" id="warn" hidden>
    The redirect landing here only confirms which URL Maya sent the browser to.
    It does not query Maya for the settled transaction status — no retrieval
    endpoint is implemented yet.
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
const path = location.pathname.replace(/\/$/, '');

const outcomes = {
  '/success': { icon: '✅', title: 'Payment successful',  msg: 'Maya redirected you back on success.' },
  '/failure': { icon: '❌', title: 'Payment failed',      msg: 'Maya redirected you back on failure.' },
  '/cancel':  { icon: '🚫', title: 'Payment cancelled',   msg: 'Maya redirected you back on cancellation.' }
};

const o = outcomes[path] || { icon: 'ℹ️', title: 'Unknown result', msg: 'Unrecognised path: ' + path };

document.getElementById('icon').textContent = o.icon;
document.getElementById('title').textContent = o.title;
document.getElementById('msg').textContent = o.msg;
document.getElementById('rrn').textContent = params.get('id') || 'not provided';
document.getElementById('warn').hidden = false;
</script>
</body>
</html>
